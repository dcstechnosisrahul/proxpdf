name: proxpdf
description: ProxPDF - Complete PDF Toolkit for Web & Mobile
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # PDF Processing
 
  printing: ^5.11.1
  
  # File Handling
  file_picker: ^6.1.1
  universal_html: ^2.2.4
  flutter_dropzone: ^4.0.3
  path_provider: ^2.1.0
  path: ^1.9.0
  
  # State Management
  provider: ^6.0.5
  syncfusion_flutter_pdf: ^26.1.41
  pdf: ^3.11.1
  
  # UI/UX
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.0
  
  # Utilities
  connectivity_plus: ^5.0.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  
  # Responsive
  responsive_builder: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/